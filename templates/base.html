<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Performance Prediction{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">🎓 Student Performance Predictor</a>
    <nav>
      <a href="{{ url_for('index') }}">Predict</a>
      <a href="{{ url_for('about') }}">Model Info</a>

  <footer class="site-footer">
    <p>Machine-learning demo — predictions are estimates, not guarantees.</p>
  </footer>
</body>
</html>
